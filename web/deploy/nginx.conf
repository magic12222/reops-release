# Standalone example: nginx -c /absolute/path/to/this/nginx.conf
# Set root to the deployed build directory; keep the C upstream private.
events {}
http {
    include /etc/nginx/mime.types; # Adjust to the Nginx installation path if needed.
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /srv/reops/web/dist;
        index index.html;

        # API failures must stay API failures, never return the SPA HTML.
        location /api/ {
            proxy_pass http://127.0.0.1:8020;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location /assets/ { try_files $uri =404; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
